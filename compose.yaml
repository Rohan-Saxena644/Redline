services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline_local_only
      POSTGRES_DB: redline
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["redline_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline -d redline"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  redline_pg:
